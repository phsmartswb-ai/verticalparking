<section class="comparison" style="background: #0a0a0a">
  <div class="section-label">Why Vertipark</div>
  <h2 class="section-title">WHY CHOOSE VERTIPARK?</h2>
  <div class="comparison-grid">
    @for (card of cards; track card.title) {
      <div class="comparison-card mat-elevation-z2" [style.border-color]="card.color + '26'" [style.background]="card.color + '0d'">
        <div class="card-icon"></div>
        <h3 class="card-title" [style.color]="card.color">{{ card.title }}</h3>
        <p class="card-text">{{ card.text }}</p>
      </div>
    }
  </div>
</section>
