<section class="comparison-table" id="vs-traditional" style="background: #0a0a0a">
  <div class="section-label">Vertipark vs. Traditional Parking</div>
  <h2 class="section-title">VERTIPARK VS. TRADITIONAL PARKING</h2>
  <div class="table-wrap">
    <table class="vs-table">
      <thead>
        <tr>
          @for (h of headers; track h) {
            <th>{{ h }}</th>
          }
        </tr>
      </thead>
      <tbody>
        @for (row of rows; track row.feature) {
          <tr>
            <td class="feature">{{ row.feature }}</td>
            <td class="vertipark">{{ row.vertipark }}</td>
            <td class="covered">{{ row.covered }}</td>
            <td class="street" [style.color]="row.streetColor">{{ row.street }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
