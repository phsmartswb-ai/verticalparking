# Netlify configuration for Vertipark static site
# https://docs.netlify.com/configure-sites/file-based-configuration/

[build]
  publish = "."
  # No build command – static HTML/CSS/JS only

# Serve the main page at the site root (no index.html in repo)
[[redirects]]
  from = "/"
  to = "/vertipark-Main.html"
  status = 200
